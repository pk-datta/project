<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0b1d4d,#2563eb);
            padding:30px;
            color:white;
        }

        .container{
            max-width:1200px;
            margin:auto;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
            background:rgba(255,255,255,0.1);
            padding:20px;
            border-radius:15px;
        }

        .top-bar h1{
            color:#4da3ff;
        }

        .logout-btn{
            text-decoration:none;
            background:red;
            color:white;
            padding:10px 20px;
            border-radius:10px;
            font-weight:bold;
        }

        .logout-btn:hover{
            background:darkred;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:rgba(255,255,255,0.1);
            border-radius:15px;
            overflow:hidden;
        }

        th, td{
            padding:15px;
            text-align:center;
        }

        th{
            background:#2563eb;
        }

        tr:nth-child(even){
            background:rgba(255,255,255,0.05);
        }

        .delete-btn{
            background:red;
            color:white;
            padding:8px 15px;
            text-decoration:none;
            border-radius:8px;
            font-size:14px;
        }

        .delete-btn:hover{
            background:darkred;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="top-bar">
        <h1>Student Admission Admin Panel</h1>
        <a href="/logout" class="logout-btn">Logout</a>
    </div>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Course</th>
            <th>Message</th>
            <th>Action</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>{{ student[4] }}</td>
            <td>{{ student[5] }}</td>
            <td>
                <a href="/delete/{{ student[0] }}" class="delete-btn">Delete</a>
            </td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
