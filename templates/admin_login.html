<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0b1d4d,#2563eb);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:rgba(255,255,255,0.1);
            padding:40px;
            width:350px;
            border-radius:20px;
            text-align:center;
            color:white;
            backdrop-filter:blur(10px);
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
        }

        h2{
            margin-bottom:25px;
            color:#4da3ff;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:10px;
            outline:none;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }
    </style>
</head>
<body>

<div class="login-box">

    <h2>Admin Login</h2>

    <form method="POST">

        <input type="text" name="username" placeholder="Enter Username" required>

        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
